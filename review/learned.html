<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>已学句子 - Typing Japanese</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    body { background:#f7f7fb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .container { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .page-header { display:flex; align-items:center; justify-content: space-between; margin-bottom: 16px; }
    .page-header h1 { font-size: 22px; margin: 0; }
    .back-link { color:#6366f1; text-decoration:none; }
    .tools { position:sticky; top:64px; z-index:10; display:flex; gap:12px; align-items:center; flex-wrap: wrap; background:#fff; padding:12px; border-radius:10px; box-shadow: 0 4px 12px rgba(0,0,0,.05); }
    .tools input[type="text"]{ flex:1 1 280px; padding:10px 12px; border:1px solid #e5e7eb; border-radius:8px; font-size:14px; }
    .tools select{ padding:10px 12px; border:1px solid #e5e7eb; border-radius:8px; }
    .stats { margin: 12px 0; color:#666; }
    .table-wrap { background:#fff; border-radius:10px; overflow:hidden; box-shadow: 0 4px 12px rgba(0,0,0,.05); }
    table { width:100%; border-collapse: collapse; }
    thead { background:#f3f4f6; }
    th, td { padding:10px 12px; border-bottom:1px solid #eee; text-align:left; font-size:14px; }
    tbody tr:hover { background:#fafafa; }
    .badge { padding:3px 8px; border-radius:12px; font-size:12px; }
    .badge.low { background:#ffe4e6; color:#e11d48; }
    .badge.medium { background:#fef3c7; color:#b45309; }
    .badge.high { background:#dcfce7; color:#15803d; }
    .pagination { display:flex; gap:12px; align-items:center; justify-content:center; margin:16px 0; }
    .pagination button { padding:8px 12px; border:1px solid #e5e7eb; background:#fff; border-radius:8px; cursor:pointer; }
    .pagination button:disabled { opacity:.5; cursor:not-allowed; }
    .nowrap { white-space: nowrap; }
    .muted { color:#888; }
    
    /* 移动端：仅显示“日文/中文”两列，并允许自动换行 */
    @media (max-width: 768px) {
      .table-wrap { overflow-x: hidden; }
      table { table-layout: fixed; }
      th, td { font-size: 14px; white-space: normal; word-break: break-word; overflow-wrap: anywhere; line-height: 1.5; }

      /* 隐藏 假名/课程/课时/掌握度/下次复习 */
      thead th:nth-child(2), thead th:nth-child(4), thead th:nth-child(5), thead th:nth-child(6), thead th:nth-child(7),
      tbody td:nth-child(2), tbody td:nth-child(4), tbody td:nth-child(5), tbody td:nth-child(6), tbody td:nth-child(7) {
        display: none;
      }

      /* 保留的两列：日文、中文 各 50% */
      thead th:nth-child(1), thead th:nth-child(3),
      tbody td:nth-child(1), tbody td:nth-child(3) {
        width: 50% !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>已学句子</h1>
      <a class="back-link" id="backHome"><i class="fas fa-home"></i> 返回首页</a>
    </div>

    <div class="tools">
      <input id="searchInput" type="text" placeholder="搜索：日文、假名、罗马音或中文翻译">
      <select id="searchScope">
        <option value="all">搜索范围：全部</option>
        <option value="jp">只按日文/假名/罗马音</option>
        <option value="cn">只按中文翻译</option>
      </select>
      <select id="langFilter">
        <option value="all" selected>语言：全部</option>
        <option value="ja">语言：日语</option>
        <option value="en">语言：英语</option>
      </select>
      <select id="pageSize">
        <option value="20">每页 20</option>
        <option value="50" selected>每页 50</option>
        <option value="100">每页 100</option>
      </select>
    </div>

    <div class="stats"><span id="totalCount">0</span> 条记录</div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:26%">日文</th>
            <th style="width:18%">假名</th>
            <th style="width:26%">中文</th>
            <th class="nowrap" style="width:10%">课程</th>
            <th class="nowrap" style="width:8%">课时</th>
            <th class="nowrap" style="width:8%">掌握度</th>
            <th class="nowrap" style="width:14%">下次复习</th>
          </tr>
        </thead>
        <tbody id="learnedTableBody">
          <tr><td colspan="7" class="muted">加载中...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination">
      <button id="btnPrev">上一页</button>
      <span id="pageInfo">1 / 1</span>
      <button id="btnNext">下一页</button>
    </div>
  </div>

  <script type="module" src="../js/review/learned.js"></script>
</body>
</html>
