<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing-Japanese</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/statistics.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- 添加 Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- 直接加载 kuromoji -->
    <script src="https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/build/kuromoji.js"></script>
    
    <!-- 添加 kuroshiro 相关依赖 -->
    <script src="https://cdn.jsdelivr.net/npm/kuroshiro@1.2.0/dist/kuroshiro.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/kuroshiro-analyzer-kuromoji@1.1.0/dist/kuroshiro-analyzer-kuromoji.min.js"></script>

    <!-- 添加加载状态样式 -->
    <style>
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .loading-overlay.active {
            display: flex;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <!-- 在 head 部分添加 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- 添加加载指示器 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>
    
    <div class="container">
        <!-- 添加遮罩层 -->
        <div class="overlay"></div>
        
        <header>
            <h1>Typing-Japanese</h1>
        </header>

        <main>
            <!-- 添加统计信息区域 -->
            <div class="stats-section">
                <div class="stats-card">
                    <div class="stats-header">
                        <h2>今日</h2>
                        <span class="today-date">2025/1/13</span>
                    </div>
                    <div class="stats-content">
                        <div class="stats-item">
                            <span class="label">学习天数</span>
                            <div class="learning-days">0</div>
                        </div>
                        <div class="stats-item" data-action="learned">
                            <span class="label">已学句子</span>
                            <div class="learned-sentences">0</div>
                        </div>
                        <div class="stats-item" data-action="review">
                            <span class="label">待复习</span>
                            <div class="review-items">0</div>
                        </div>
                        <div class="stats-item" data-action="stats">
                            <span class="label">统计</span>
                            <i class="fas fa-chart-line"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="course-section">
                <div class="section-header">
                    <h2>课程列表</h2>
                    <div class="header-buttons">
                        <button class="action-button" data-action="manage-collections">
                            <i class="fas fa-folder"></i> 管理收藏夹
                        </button>
                        <select id="bookSelector" class="action-button" style="background:#fff;color:#333;border:1px solid #ced4da;">
                            <option value="word-group">词组记单词</option>
                            <option value="standard-basic-1">写给无法说出一句完整日语的人</option>
                        </select>
                        <a href="/typingJapanese/practice/courses.html" class="view-all-btn">
                            查看全部课程
                        </a>
                    </div>
                </div>
                <div class="course-list">
                    <!-- 课程列表将由 JavaScript 动态生成 -->
                </div>
            </div>

            <!-- 添加复习面板 -->
            <div id="reviewPanel" class="review-panel">
                <div class="review-header">
                    <select id="reviewFilter">
                        <option value="all">全部句子</option>
                        <option value="today">今日待复习</option>
                        <option value="weak">需要加强</option>
                    </select>
                    <button class="close-btn">×</button>
                </div>
                <div class="review-count">待复习：0</div>
                <div class="review-list"></div>
                <div class="review-pagination" style="display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0;">
                    <button id="reviewPrev" type="button">上一页</button>
                    <span id="reviewPageInfo">1 / 1</span>
                    <button id="reviewNext" type="button">下一页</button>
                </div>
                <div class="review-options">
                    <label><input type="checkbox" id="randomOrder"> 随机顺序</label>
                    <label><input type="checkbox" id="focusWeak"> 专注薄弱项</label>
                </div>
                <div class="review-actions">
                    <button onclick="startReview('typing')">打字练习</button>
                    <button onclick="startReview('flashcard')">闪卡记忆</button>
                </div>
            </div>

            <!-- 统计面板 -->
            <div id="statsPanel" class="stats-panel">
                <div class="stats-panel-header">
                    <h2>学习统计</h2>
                    <button type="button" class="close-btn" aria-label="关闭" onclick="closeStatsPanel()">&times;</button>
                </div>
                <div class="stats-content">
                    <!-- 学习记录卡片 -->
                    <div class="stats-card">
                        <div class="stats-card-header">
                            <span class="stats-card-title">学习趋势</span>
                        </div>
                        <div class="learning-trend">
                            <canvas id="learningTrendChart"></canvas>
                        </div>
                    </div>
                    <!-- 掌握情况卡片 -->
                    <div class="stats-card">
                        <div class="stats-card-header">
                            <span class="stats-card-title">掌握情况</span>
                        </div>
                        <div class="mastery-indicators">
                            <div class="mastery-item">
                                <div class="mastery-icon mastery-high">高</div>
                                <div class="mastery-info">
                                    <div class="mastery-label">完全掌握</div>
                                    <div class="mastery-value" id="masteryHighTotal">0</div>
                                </div>
                            </div>
                            <div class="mastery-item">
                                <div class="mastery-icon mastery-medium">中</div>
                                <div class="mastery-info">
                                    <div class="mastery-label">基本掌握</div>
                                    <div class="mastery-value" id="masteryMedium">0</div>
                                </div>
                            </div>
                            <div class="mastery-item">
                                <div class="mastery-icon mastery-low">低</div>
                                <div class="mastery-info">
                                    <div class="mastery-label">需要加强</div>
                                    <div class="mastery-value" id="masteryLow">0</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <canvas id="statsChart"></canvas>
        </main>
    </div>

    <!-- 第三方库 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- 核心模块 -->
    <script type="module" src="js/common/statsData.js"></script>
    <script type="module" src="js/index.js"></script>
    
    <!-- 统计相关模块 -->
    <script type="module" src="js/statsChart.js"></script>
    <script type="module" src="js/statistics.js"></script>
    
    <!-- 课程显示模块 -->
    <script type="module">
        import { CourseDisplay } from './js/courseDisplay.js';
        import { CustomCollectionsManager } from './js/customCollections.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            try {
                // 初始化自定义收藏管理器
                window.customCollectionsManager = new CustomCollectionsManager();
                
                // 初始化课程显示
                const courseDisplay = new CourseDisplay();
                courseDisplay.loadCourses();

                // 添加收藏夹相关事件监听
                const collectionsModal = document.getElementById('collectionsModal');
                const addCollectionModal = document.getElementById('addCollectionModal');
                
                // 打开收藏夹列表
                document.querySelector('[data-action="manage-collections"]').addEventListener('click', () => {
                    collectionsModal.classList.add('show');
                });

                // 关闭按钮事件
                document.querySelectorAll('.close-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        collectionsModal.classList.remove('show');
                        addCollectionModal.classList.remove('show');
                    });
                });

                // 新建收藏夹按钮
                document.querySelector('.add-collection-btn').addEventListener('click', () => {
                    collectionsModal.classList.remove('show');
                    addCollectionModal.classList.add('show');
                });

                // 处理新建收藏夹表单提交
                document.getElementById('addCollectionForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const name = document.getElementById('collectionName').value;
                    const description = document.getElementById('collectionDescription').value;
                    window.customCollectionsManager.createCollection(name, description);
                    addCollectionModal.classList.remove('show');
                    document.getElementById('addCollectionForm').reset();
                });

                // 取消按钮事件
                document.querySelectorAll('.cancel-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        addCollectionModal.classList.remove('show');
                        document.getElementById('addCollectionForm').reset();
                    });
                });

            } catch (error) {
                console.error('Error initializing:', error);
                const courseList = document.querySelector('.course-list');
                if (courseList) {
                    courseList.innerHTML = `
                        <div class="error-message">
                            加载失败，请刷新页面重试
                        </div>
                    `;
                }
            }
        });
    </script>

    <!-- 在 body 末尾添加模态框 -->
    <div class="modal" id="collectionsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>管理收藏夹</h2>
                <button class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <button class="add-collection-btn">
                    <i class="fas fa-plus"></i> 新建收藏夹
                </button>
                <div class="collections-list">
                    <!-- 收藏夹列表将在这里动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="addCollectionModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>新建收藏夹</h2>
                <button class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="addCollectionForm">
                    <div class="form-group">
                        <label for="collectionName">收藏夹名称</label>
                        <input type="text" id="collectionName" required placeholder="例如：旅行常用句">
                    </div>
                    <div class="form-group">
                        <label for="collectionDescription">描述</label>
                        <textarea id="collectionDescription" placeholder="简单描述一下这个收藏夹..."></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="primary-btn">创建</button>
                        <button type="button" class="secondary-btn cancel-btn">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal" id="addSentenceModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>添加新句子</h2>
                <button class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="addSentenceForm">
                    <div class="form-group">
                        <label for="japanese">日语</label>
                        <div class="input-group">
                            <input type="text" id="japanese" required placeholder="输入日语句子">
                            <button type="button" class="convert-btn" id="convertBtn" disabled>
                                <i class="fas fa-sync"></i> 转换
                            </button>
                        </div>
                        <div class="auto-convert-toggle">
                            <label>
                                <input type="checkbox" id="autoConvert" checked>
                                自动转换
                            </label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="hiragana">平假名</label>
                        <div class="input-group">
                            <input type="text" 
                                   id="hiragana" 
                                   required 
                                   placeholder="用冒号分隔，如：わたし:は:がくせい:です"
                                   readonly>
                            <div class="loading-spinner" style="display: none;"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="romaji">罗马音</label>
                        <div class="input-group">
                            <input type="text" 
                                   id="romaji" 
                                   required 
                                   placeholder="watashi:wa:gakusei:desu"
                                   readonly>
                            <div class="loading-spinner" style="display: none;"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="meaning">中文含义</label>
                        <input type="text" id="meaning" required placeholder="输入中文翻译">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="primary-btn">保存</button>
                        <button type="button" class="secondary-btn cancel-btn">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal" id="viewSentencesModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>句子列表</h3>
                <button type="button" class="close-btn" aria-label="关闭">&times;</button>
            </div>
            <div class="modal-body">
                <div class="sentences-container">
                    <!-- 句子列表将在这里动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 然后加载转换器 -->
    <script type="module">
        import converter from './js/converter.js';
        
        // 在页面加载完成后预初始化转换器
        window.addEventListener('DOMContentLoaded', () => {
            converter.initTokenizer().catch(error => {
                console.warn('预初始化失败，将在首次使用时重试:', error);
            });
        });
    </script>

    <!-- 修改这里：添加 type="module" -->
    <script type="module">
        import Statistics from './js/common/statistics.js';

        // 更新统计显示
        function updateStatisticsDisplay() {
            // 获取最新统计数据
            const stats = Statistics.getStatistics();
            
            // 更新学习天数
            const learningDaysElement = document.querySelector('.learning-days');
            if (learningDaysElement) {
                learningDaysElement.textContent = Statistics.getLearningDays();
            }

            // 更新已学句子数
            const learnedSentencesElement = document.querySelector('.learned-sentences');
            if (learnedSentencesElement) {
                learnedSentencesElement.textContent = Statistics.getLearnedSentences();
            }

            // 更新待复习数量
            const reviewItemsElement = document.querySelector('.review-items');
            if (reviewItemsElement) {
                const now = new Date();
                const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                let reviewCount = 0;

                // 从 reviewHistory 中获取待复习数据
                if (stats.reviewHistory) {
                    Object.values(stats.reviewHistory).forEach(item => {
                        if (item.nextReviewDate) {
                            const nextReview = new Date(item.nextReviewDate);
                            const reviewDay = new Date(nextReview.getFullYear(), nextReview.getMonth(), nextReview.getDate());
                            
                            if (reviewDay <= today) {
                                reviewCount++;
                            }
                        }
                    });
                }

                reviewItemsElement.textContent = reviewCount;
            }
        }

        // 页面加载时更新显示
        document.addEventListener('DOMContentLoaded', () => {
            updateStatisticsDisplay();
        });

        // 监听统计更新事件
        window.addEventListener('statisticsUpdated', () => {
            updateStatisticsDisplay();
        });
    </script>
</body>
</html>
